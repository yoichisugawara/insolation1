<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>園地登録 | 浜松サンシャイン農産物 管理画面</title>

  <!-- PWA設定 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ff7e5f">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- QR Code Library (qrcodejs) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; background: #f4f6f8; color: #333; }
    .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h1 { font-size: 1.4rem; color: #ff7e5f; margin-top: 0; text-align: center; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9rem; }
    input[type="text"], textarea, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 0.95rem; }
    #map { height: 250px; border-radius: 8px; margin-top: 5px; }
    .coords { font-size: 0.85rem; color: #666; margin-top: 5px; }
    button { width: 100%; padding: 12px; background: #ff7e5f; color: #fff; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #e66b4e; }
    
    /* QRコード完了モーダル */
    #resultBox { display: none; margin-top: 25px; padding: 20px; background: #fff8f5; border: 2px dashed #ff7e5f; border-radius: 12px; text-align: center; }
    #qrcode { display: flex; justify-content: center; margin: 15px 0; }
    .url-box { font-size: 0.8rem; word-break: break-all; background: #fff; padding: 8px; border: 1px solid #ddd; border-radius: 4px; margin-bottom: 10px; }
    .btn-secondary { background: #666; margin-top: 8px; }
    .btn-secondary:hover { background: #444; }
  </style>
</head>
<body>

<div class="container">
  <h1>🍊 園地登録（管理画面）</h1>

  <form id="registerForm">
    <div class="form-group">
      <label for="farmerName">農家名・農園名</label>
      <input type="text" id="farmerName" placeholder="例: 山田農園" required>
    </div>

    <div class="form-group">
      <label for="fieldName">園地名</label>
      <input type="text" id="fieldName" placeholder="例: 三ヶ日平野第1園地" required>
    </div>

    <div class="form-group">
      <label for="cropType">作物</label>
      <select id="cropType">
        <option value="みかん">みかん</option>
        <option value="お茶">お茶</option>
        <option value="いちご">いちご</option>
        <option value="メロン">メロン</option>
        <option value="その他">その他</option>
      </select>
    </div>

    <div class="form-group">
      <label>📍 園地の位置を指定（地図をクリック）</label>
      <div id="map"></div>
      <div class="coords">緯度: <span id="latVal">34.7952</span> / 経度: <span id="lngVal">137.5514</span></div>
    </div>

    <div class="form-group">
      <label for="description">こだわりメッセージ</label>
      <textarea id="description" rows="3" placeholder="例: 三ヶ日の太陽をたっぷり浴びて育った甘み濃厚なみかんです！"></textarea>
    </div>

    <button type="submit" id="submitBtn">園地を登録してQRコードを発行</button>
  </form>

  <!-- 登録完了・QRコード表示エリア -->
  <div id="resultBox">
    <h3>🎉 登録が完了しました！</h3>
    <p style="font-size: 0.85rem; color: #666;">以下のQRコードを商品シールやPOPに印刷してご活用ください。</p>
    
    <div id="qrcode"></div>
    <div class="url-box" id="cardUrl"></div>

    <button onclick="openCardUrl()" style="background: #4caf50; margin-bottom: 8px;">証明カードを表示してみる</button>
    <button onclick="window.print()" class="btn-secondary">QRコードを印刷・保存</button>
  </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwVzy7kWfu7O0WrYcFTp_vUGjVj41xnS9ah3SH9U0l2K49X0oXG7M6cF-70MLnRh5W9/exec';
  let currentLat = 34.7952;
  let currentLng = 137.5514;
  let generatedUrl = '';

  // 地図の初期化（浜松周辺）
  const map = L.map('map').setView([currentLat, currentLng], 11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  let marker = L.marker([currentLat, currentLng], { draggable: true }).addTo(map);

  function updateCoords(lat, lng) {
    currentLat = parseFloat(lat).toFixed(4);
    currentLng = parseFloat(lng).toFixed(4);
    document.getElementById('latVal').textContent = currentLat;
    document.getElementById('lngVal').textContent = currentLng;
  }

  map.on('click', (e) => {
    marker.setLatLng(e.latlng);
    updateCoords(e.latlng.lat, e.latlng.lng);
  });

  marker.on('dragend', (e) => {
    const position = marker.getLatLng();
    updateCoords(position.lat, position.lng);
  });

  // フォーム送信（登録処理）
  document.getElementById('registerForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = '登録中...';

    const payload = {
      action: 'registerField',
      farmer_name: document.getElementById('farmerName').value,
      field_name: document.getElementById('fieldName').value,
      crop_type: document.getElementById('cropType').value,
      latitude: currentLat,
      longitude: currentLng,
      description: document.getElementById('description').value
    };

    fetch(GAS_WEB_APP_URL, {
      method: 'POST',
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(resData => {
      btn.disabled = false;
      btn.textContent = '園地を登録してQRコードを発行';

      if (resData.status === 'success') {
        const fieldId = resData.field_id;
        // GitHub Pages上の証明カードURLを生成
        const baseUrl = window.location.href.replace('admin.html', 'index.html');
        generatedUrl = `${baseUrl}?field_id=${fieldId}`;

        // QRコード生成
        document.getElementById('qrcode').innerHTML = '';
        new QRCode(document.getElementById('qrcode'), {
          text: generatedUrl,
          width: 160,
          height: 160
        });

        document.getElementById('cardUrl').textContent = generatedUrl;
        document.getElementById('resultBox').style.display = 'block';
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      } else {
        alert('登録エラー: ' + resData.message);
      }
    })
    .catch(err => {
      btn.disabled = false;
      btn.textContent = '園地を登録してQRコードを発行';
      alert('通信エラーが発生しました: ' + err);
    });
  });

  function openCardUrl() {
    if (generatedUrl) window.open(generatedUrl, '_blank');
  }

  // PWA Service Worker 登録
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(err => console.log('SW reg error:', err));
  }
</script>

</body>
</html>
