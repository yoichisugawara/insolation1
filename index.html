<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日照量証明カード | 浜松サンシャイン農産物</title>

  <!-- PWA設定 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ff7e5f">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; margin: 0; padding: 12px; background: #f7f5f0; color: #2d3748; line-height: 1.5; }
    .card { max-width: 480px; margin: 0 auto 30px auto; background: #fff; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.08); border: 1px solid rgba(0,0,0,0.04); }
    
    .header { background: linear-gradient(135deg, #ff6b4a, #ffa057); padding: 32px 20px; text-align: center; color: #fff; position: relative; }
    .badge { background: rgba(255, 255, 255, 0.95); color: #e65100; font-weight: 800; padding: 6px 16px; border-radius: 20px; font-size: 0.8rem; display: inline-block; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); letter-spacing: 0.5px; }
    .main-score { font-size: 1.8rem; font-weight: 800; margin: 5px 0; line-height: 1.25; }
    .main-score span.percent { font-size: 3.4rem; color: #fff; text-shadow: 0 3px 6px rgba(0,0,0,0.2); font-weight: 900; }
    .sub-text { font-size: 0.95rem; opacity: 0.95; margin-top: 8px; font-weight: 600; }
    
    .content { padding: 22px 18px; }
    .section-title { font-size: 0.95rem; font-weight: 800; color: #4a5568; border-left: 4px solid #ff6b4a; padding-left: 10px; margin: 22px 0 12px 0; letter-spacing: 0.5px; display: flex; align-items: center; }
    #map { height: 210px; border-radius: 14px; margin-bottom: 10px; box-shadow: inset 0 0 5px rgba(0,0,0,0.1); }
    
    .info-box { background: #faf8f5; padding: 14px 16px; border-radius: 12px; font-size: 0.88rem; color: #4a5568; border: 1px solid #f0eae1; }
    .chart-container { position: relative; height: 210px; width: 100%; margin-top: 8px; }
    
    /* SNS共有エリア */
    .share-section { margin-top: 25px; padding-top: 18px; border-top: 1px dashed #e2e8f0; text-align: center; }
    .share-title { font-size: 0.85rem; font-weight: bold; color: #718096; margin-bottom: 12px; }
    .share-buttons { display: flex; gap: 10px; justify-content: center; }
    .share-btn { flex: 1; padding: 10px 12px; border-radius: 10px; text-decoration: none; font-size: 0.85rem; font-weight: bold; color: #fff; display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; border: none; transition: opacity 0.2s; }
    .share-btn:active { opacity: 0.8; }
    .btn-x { background: #000; }
    .btn-line { background: #06c755; }
    .btn-native { background: #ff6b4a; }

    .footer { text-align: center; padding: 16px; font-size: 0.72rem; color: #a0aec0; background: #f8fafc; border-top: 1px solid #edf2f7; }
    #loading { text-align: center; padding: 60px 20px; font-size: 1rem; color: #a0aec0; font-weight: bold; }
  </style>
</head>
<body>

<div class="card">
  <div id="loading">☀️ 太陽光観測データを取得中...</div>

  <div id="app" style="display: none;">
    <!-- 1. メインヘッダー -->
    <div class="header">
      <div class="badge">☀️ 太陽光データ証明書</div>
      <div class="main-score">全国平均より<br><span class="percent">+<span id="diffPercent">0</span>%</span><br>太陽を浴びました！</div>
      <div class="sub-text">［<span id="cropName">みかん</span>］ <span id="fieldName">園地名</span></div>
    </div>

    <div class="content">
      <!-- 2. 地図 -->
      <div class="section-title">📍 園地の場所と浜松の環境</div>
      <div id="map"></div>
      <div class="info-box">
        浜松エリアは全国トップクラスの日照量を誇ります。強い直射光と日射環境が、農産物のコクと甘みを最大限に引き出します。
      </div>

      <!-- 3. 月別グラフ -->
      <div class="section-title">📊 2024年 月別日射量推移 (vs 全国平均)</div>
      <div class="chart-container">
        <canvas id="solarChart"></canvas>
      </div>

      <!-- 4. 生産者情報 -->
      <div class="section-title">👨‍🌾 生産者・園地情報</div>
      <div class="info-box">
        <strong id="farmerName" style="font-size: 1rem; color: #2d3748;">農家名</strong><br>
        <span id="description" style="margin-top: 4px; display: block;">メッセージが入ります。</span>
      </div>

      <!-- 5. SNSシェア機能 -->
      <div class="share-section">
        <div class="share-title">＼ 太陽の恵みをSNSでシェア ／</div>
        <div class="share-buttons">
          <button class="share-btn btn-x" onclick="shareX()">Xでポスト</button>
          <button class="share-btn btn-line" onclick="shareLINE()">LINE</button>
          <button class="share-btn btn-native" onclick="shareNative()">共有</button>
        </div>
      </div>
    </div>

    <div class="footer">
      データ出典: Open-Meteo Historical Weather API<br>
      浜松サンシャイン農産物プロジェクト
    </div>
  </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwVzy7kWfu7O0WrYcFTp_vUGjVj41xnS9ah3SH9U0l2K49X0oXG7M6cF-70MLnRh5W9/exec';

  const urlParams = new URLSearchParams(window.location.search);
  const fieldId = urlParams.get('field_id') || 'field_mikkabi_01';
  let shareData = {};

  fetch(`${GAS_WEB_APP_URL}?action=getField&field_id=${fieldId}`)
    .then(res => res.json())
    .then(resData => {
      if (resData.status !== 'success') {
        alert('データの読み込みに失敗しました');
        return;
      }

      const field = resData.data.field;
      const solar = resData.data.solar;

      shareData = {
        farmerName: field.farmer_name,
        fieldName: field.field_name,
        cropName: field.crop_type,
        diffPercent: solar.diff_percent,
        url: window.location.href
      };

      document.getElementById('diffPercent').textContent = solar.diff_percent;
      document.getElementById('cropName').textContent = field.crop_type;
      document.getElementById('fieldName').textContent = field.field_name;
      document.getElementById('farmerName').textContent = field.farmer_name;
      document.getElementById('description').textContent = field.description;

      document.getElementById('loading').style.display = 'none';
      document.getElementById('app').style.display = 'block';

      initMap(field.latitude, field.longitude);
      initChart(solar.monthly_data);
    });

  function initMap(lat, lng) {
    const map = L.map('map', { zoomControl: false }).setView([lat, lng], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    L.circle([lat, lng], {
      color: '#ff6b4a',
      fillColor: '#ffa057',
      fillOpacity: 0.35,
      radius: 2000
    }).addTo(map);

    L.marker([lat, lng]).addTo(map)
      .bindPopup(`<b>${shareData.farmerName}</b><br>${shareData.fieldName}`).openPopup();
  }

  function initChart(monthlyData) {
    const ctx = document.getElementById('solarChart').getContext('2d');
    const nationalAvgMonthly = [2.4, 2.8, 3.4, 3.9, 4.2, 3.7, 4.3, 4.4, 3.5, 3.1, 2.6, 2.3];

    new Chart(ctx, {
      type: 'line',
      data: {
        labels: ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'],
        datasets: [
          {
            label: 'この園地 (kWh/㎡)',
            data: monthlyData,
            borderColor: '#ff6b4a',
            backgroundColor: 'rgba(255, 107, 74, 0.15)',
            fill: true,
            tension: 0.35,
            borderWidth: 3,
            pointRadius: 2
          },
          {
            label: '全国平均',
            data: nationalAvgMonthly,
            borderColor: '#a0aec0',
            borderDash: [4, 4],
            fill: false,
            tension: 0.35,
            borderWidth: 2,
            pointRadius: 0
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } }
        },
        scales: {
          y: { beginAtZero: false, grid: { color: '#edf2f7' } },
          x: { grid: { display: false } }
        }
      }
    });
  }

  // SNS共有機能
  function shareX() {
    const text = `【太陽光データ証明】${shareData.farmerName}の${shareData.cropName}は、全国平均より＋${shareData.diffPercent}%太陽の光を浴びて育ちました！☀️ #浜松サンシャイン農産物 #JAXAデータ証明\n`;
    window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(shareData.url)}`, '_blank');
  }

  function shareLINE() {
    const text = `【太陽光データ証明】${shareData.farmerName}の${shareData.cropName}は全国平均より＋${shareData.diffPercent}%太陽を浴びて育ちました！☀️\n${shareData.url}`;
    window.open(`https://line.me/R/msg/text/?${encodeURIComponent(text)}`, '_blank');
  }

  function shareNative() {
    if (navigator.share) {
      navigator.share({
        title: '日照量証明カード',
        text: `${shareData.farmerName}の${shareData.cropName}（全国平均比 ＋${shareData.diffPercent}%）`,
        url: shareData.url
      });
    } else {
      shareX();
    }
  }

  // PWA Service Worker 登録
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(err => console.log('SW reg error:', err));
  }
</script>

</body>
</html>
