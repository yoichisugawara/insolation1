<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日照量証明カード | 浜松サンシャイン農産物</title>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<!-- Chart.js（Chart.js v4 安定版） -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; background: #faf8f5; color: #333; }
    .card { max-width: 500px; margin: 0 auto; background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    .header { background: linear-gradient(135deg, #ff7e5f, #feb47b); padding: 30px 20px; text-align: center; color: #fff; }
    .badge { background: #fff; color: #e65100; font-weight: bold; padding: 6px 16px; border-radius: 20px; font-size: 0.85rem; display: inline-block; margin-bottom: 12px; }
    .main-score { font-size: 2.2rem; font-weight: 800; margin: 5px 0; line-height: 1.2; }
    .main-score span { font-size: 3.2rem; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }
    .sub-text { font-size: 0.9rem; opacity: 0.95; }
    .content { padding: 20px; }
    .section-title { font-size: 1rem; font-weight: bold; color: #444; border-left: 4px solid #ff7e5f; padding-left: 8px; margin: 20px 0 10px 0; }
    #map { height: 220px; border-radius: 12px; margin-bottom: 10px; }
    .info-box { background: #f9f9f9; padding: 12px 15px; border-radius: 8px; font-size: 0.9rem; line-height: 1.5; color: #555; }
    .chart-container { position: relative; height: 200px; width: 100%; margin-top: 10px; }
    .footer { text-align: center; padding: 15px; font-size: 0.75rem; color: #aaa; background: #f4f4f4; }
    #loading { text-align: center; padding: 50px 20px; font-size: 1.1rem; color: #888; }
  </style>
</head>
<body>

<div class="card">
  <div id="loading">☀️ 日照量データを読み込み中...</div>

  <div id="app" style="display: none;">
    <!-- 1. メインコピー（最上部バッジ） -->
    <div class="header">
      <div class="badge">☀️ JAXA衛星データ証明</div>
      <div class="main-score">全国平均より<br><span>+<span id="diffPercent">0</span>%</span><br>太陽を浴びました！</div>
      <div class="sub-text"><span id="cropName">みかん</span> / <span id="fieldName">園地名</span></div>
    </div>

    <div class="content">
      <!-- 2. 地図 & ヒートマップ風タイルの重ね合わせ -->
      <div class="section-title">📍 園地の場所と浜松の日当たり環境</div>
      <div id="map"></div>
      <div class="info-box">
        浜松エリアは全国トップクラスの日照量を誇ります。浜名湖からの湖面反射光や南向きの傾斜地が、濃厚な甘みを育みます。
      </div>

      <!-- 3. 月別日射量の比較グラフ -->
      <div class="section-title">📊 月別日射量の推移（vs 全国平均）</div>
      <div class="chart-container">
        <canvas id="solarChart"></canvas>
      </div>

      <!-- 4. 生産者・メッセージ -->
      <div class="section-title">👨‍🌾 生産者情報</div>
      <div class="info-box">
        <strong id="farmerName">農家名</strong><br>
        <span id="description">メッセージがここに入ります。</span>
      </div>
    </div>

    <div class="footer">
      データ提供: JAXA Satellite Data Platform / 浜松アグリバイオプロジェクト
    </div>
  </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // GASのWebアプリURL（ご自身のURLに差し替えてください）
  const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwVzy7kWfu7O0WrYcFTp_vUGjVj41xnS9ah3SH9U0l2K49X0oXG7M6cF-70MLnRh5W9/exec';

  // URLパラメータからfield_idを取得（指定がない場合は初期データ）
  const urlParams = new URLSearchParams(window.location.search);
  const fieldId = urlParams.get('field_id') || 'field_mikkabi_01';

  // データ取得
  fetch(`${GAS_WEB_APP_URL}?action=getField&field_id=${fieldId}`)
    .then(res => res.json())
    .then(resData => {
      if (resData.status !== 'success') {
        alert('データの読み込みに失敗しました');
        return;
      }

      const field = resData.data.field;
      const solar = resData.data.solar || { diff_percent: 16.1, monthly_data: [2.8, 3.2, 3.9, 4.5, 4.8, 4.2, 5.1, 5.0, 4.1, 3.6, 3.0, 2.7] };

      // テキスト反映
      document.getElementById('diffPercent').textContent = solar.diff_percent;
      document.getElementById('cropName').textContent = field.crop_type;
      document.getElementById('fieldName').textContent = field.field_name;
      document.getElementById('farmerName').textContent = field.farmer_name;
      document.getElementById('description').textContent = field.description;

      document.getElementById('loading').style.display = 'none';
      document.getElementById('app').style.display = 'block';

      // 1. 地図・ヒートマップタイルの表示
      initMap(field.latitude, field.longitude);

      // 2. 折れ線グラフの表示
      initChart(solar.monthly_data);
    });

  // 地図 ＆ 日照ヒートマップ重ね合わせ関数
  function initMap(lat, lng) {
    const map = L.map('map', { zoomControl: false }).setView([lat, lng], 12);

    // ベースの標準地図
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    // ★日照量ヒートマップ風のカラータイルの重ね合わせ（オレンジ半透明の円で可視化）
    const heatGrid = L.circle([lat, lng], {
      color: '#ff5722',
      fillColor: '#ff9800',
      fillOpacity: 0.35,
      radius: 1800 // 1.8kmの範囲を日照エリアとして可視化
    }).addTo(map);

    // 該当園地のピン
    L.marker([lat, lng]).addTo(map)
      .bindPopup('<b>この園地です！</b>').openPopup();
  }

  // 折れ線グラフ描画関数
  function initChart(monthlyData) {
    const ctx = document.getElementById('solarChart').getContext('2d');
    
    // 全国平均のダミー月別数値
    const nationalAvgMonthly = [2.4, 2.8, 3.4, 3.9, 4.2, 3.7, 4.3, 4.4, 3.5, 3.1, 2.6, 2.3];

    new Chart(ctx, {
      type: 'line',
      data: {
        labels: ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'],
        datasets: [
          {
            label: 'この園地 (kWh/㎡)',
            data: monthlyData,
            borderColor: '#ff7e5f',
            backgroundColor: 'rgba(255, 126, 95, 0.2)',
            fill: true,
            tension: 0.3,
            borderWidth: 3
          },
          {
            label: '全国平均',
            data: nationalAvgMonthly,
            borderColor: '#aaa',
            borderDash: [5, 5],
            fill: false,
            tension: 0.3,
            borderWidth: 2
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 10 } } }
        },
        scales: {
          y: { beginAtZero: false, grid: { color: '#eee' } },
          x: { grid: { display: false } }
        }
      }
    });
  }
</script>

</body>
</html>
